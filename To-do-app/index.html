<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> To-Do App</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(100%, 480px);
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(12, 22, 57, 0.12);
      padding: 32px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.8rem, 2.2vw, 2.6rem);
      letter-spacing: -0.03em;
    }

    .new-task {
      display: grid;
      gap: 12px;
      margin-bottom: 24px;
    }

    .new-task input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid #dfe3ec;
      font-size: 1rem;
      outline: none;
    }

    .new-task button {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 14px;
      background: #3b82f6;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .new-task button:hover {
      background: #2563eb;
    }

    .tasks {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    .task {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      background: #fafbff;
    }

    .task.completed .label {
      text-decoration: line-through;
      color: #6b7280;
    }

    .task .label {
      margin: 0;
      font-size: 1rem;
    }

    .task button {
      border: none;
      background: transparent;
      color: #ef4444;
      font-size: 1rem;
      cursor: pointer;
    }

    .task input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #3b82f6;
      cursor: pointer;
    }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      color: #475569;
      font-size: 0.95rem;
    }

    .status span {
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Simple To-Do List</h1>

    <div class="new-task">
      <input id="taskInput" type="text" placeholder="What do you want to do today?" />
      <button id="addTaskBtn" type="button">Add Task</button>
    </div>

    <ul id="tasks" class="tasks"></ul>

    <div class="status">
      <span id="taskCount">No tasks yet.</span>
      <button id="clearCompleted" type="button">Clear Completed</button>
    </div>
  </main>

  <script>
    const taskInput = document.getElementById('taskInput');
    const addTaskBtn = document.getElementById('addTaskBtn');
    const tasksList = document.getElementById('tasks');
    const taskCount = document.getElementById('taskCount');
    const clearCompletedBtn = document.getElementById('clearCompleted');

    let tasks = [];

    function saveTasks() {
      localStorage.setItem('todoTasks', JSON.stringify(tasks));
    }

    function loadTasks() {
      const stored = localStorage.getItem('todoTasks');
      tasks = stored ? JSON.parse(stored) : [];
    }

    function updateStatus() {
      const total = tasks.length;
      const completed = tasks.filter((task) => task.completed).length;
      if (total === 0) {
        taskCount.textContent = 'No tasks yet.';
      } else {
        taskCount.textContent = `${completed} of ${total} completed`;
      }
    }

    function renderTasks() {
      tasksList.innerHTML = '';

      tasks.forEach((task) => {
        const li = document.createElement('li');
        li.className = 'task';
        if (task.completed) li.classList.add('completed');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.completed;
        checkbox.addEventListener('change', () => {
          task.completed = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const label = document.createElement('p');
        label.className = 'label';
        label.textContent = task.text;

        const removeButton = document.createElement('button');
        removeButton.textContent = 'Remove';
        removeButton.addEventListener('click', () => {
          tasks = tasks.filter((item) => item.id !== task.id);
          saveTasks();
          renderTasks();
        });

        li.append(checkbox, label, removeButton);
        tasksList.appendChild(li);
      });

      updateStatus();
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;

      tasks.push({
        id: crypto.randomUUID(),
        text,
        completed: false,
      });

      taskInput.value = '';
      saveTasks();
      renderTasks();
      taskInput.focus();
    }

    addTaskBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keypress', (event) => {
      if (event.key === 'Enter') addTask();
    });

    clearCompletedBtn.addEventListener('click', () => {
      tasks = tasks.filter((task) => !task.completed);
      saveTasks();
      renderTasks();
    });

    loadTasks();
    renderTasks();
  </script>
</body>
</html>
